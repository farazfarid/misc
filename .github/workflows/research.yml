# One-off research fetch for MovieParkWaits (ride heights + map coordinates).
# Runs only on pushes to this throwaway branch; results are committed back here.
name: Movie Park research fetch
on:
  push:
    branches: [data-research]
    paths: ['.github/workflows/research.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (MovieParkWaits research; fan project)"
          Q='[out:json][timeout:90];
          (way["tourism"="theme_park"]["name"~"Movie Park",i];relation["tourism"="theme_park"]["name"~"Movie Park",i];)->.p;
          .p out geom;
          .p map_to_area->.a;
          (nwr(area.a)["attraction"];nwr(area.a)["tourism"="attraction"];nwr(area.a)["roller_coaster"];nwr(area.a)["amenity"="toilets"];nwr(area.a)["entrance"];);
          out center tags;'
          curl -sS -m 120 -A "$UA" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -o out/osm.json || echo "overpass failed" > out/osm.err
          for u in https://www.movieparkgermany.de/ https://www.movieparkgermany.de/sitemap.xml https://movieparkgermany.de/sitemap.xml https://www.movieparkgermany.de/attraktionen https://www.movieparkgermany.de/de/attraktionen https://coasterpedia.net/wiki/Movie_Park_Germany https://de.wikipedia.org/wiki/Movie_Park_Germany https://en.wikipedia.org/wiki/Movie_Park_Germany https://queue-times.com/parks/310/queue_times.json; do
            f=out/$(echo "$u" | sed 's#https\?://##; s#[^A-Za-z0-9._-]#_#g')
            curl -sSL -m 30 -A "$UA" -w "%{http_code} %{url_effective}\n" "$u" -o "$f" >> out/status.txt 2>&1 || echo "FAIL $u" >> out/status.txt
          done
          # Follow attraction pages found in any sitemap/home page (max 80).
          cat out/*sitemap* out/www.movieparkgermany.de_ 2>/dev/null | grep -oE 'https://(www\.)?movieparkgermany\.de/[^"<> ]*(attraktion|attraction|ride|fahrgeschaeft)[^"<> ]*' | sort -u | head -80 > out/attraction-urls.txt || true
          i=0; while read -r u; do i=$((i+1)); curl -sSL -m 20 -A "$UA" "$u" -o "out/page_$i.html" -w "%{http_code} $u\n" >> out/status.txt 2>&1; done < out/attraction-urls.txt
          ls -la out
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -q -m "Research fetch results" && git push
